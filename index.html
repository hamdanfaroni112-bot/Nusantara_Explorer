<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Aritmatika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --kertas:#F2F7FB; --garis:#CBDDEC; --tinta:#1E3A5F; --tinta-pudar:#5B7594;
    --margin:#D9534F; --stabilo:#FFE066; --benar:#2E9E6B; --salah:#D9534F; --putih:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --kertas:#16202C; --garis:#243547; --tinta:#E6EEF7; --tinta-pudar:#8DA4BD;
           --stabilo:#B89A18; --putih:#1D2B3B; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Patrick Hand','Comic Sans MS',cursive; color:var(--tinta);
    background-color:var(--kertas);
    background-image:
      linear-gradient(var(--garis) 1px, transparent 1px),
      linear-gradient(90deg, var(--garis) 1px, transparent 1px);
    background-size:28px 28px;
    display:flex; justify-content:center; padding:20px 14px 40px;
  }
  .kertas{
    width:100%; max-width:460px; background:var(--kertas);
    border:2px solid var(--tinta); border-radius:6px;
    padding:22px 20px 24px 34px; position:relative;
    box-shadow:5px 5px 0 var(--tinta);
  }
  .kertas::before{ /* garis margin merah */
    content:""; position:absolute; left:20px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.7;
  }
  h1{font-family:'Gaegu',cursive;font-size:2.4rem;margin:0 0 4px;line-height:1}
  h2{font-family:'Gaegu',cursive;font-size:1.6rem;margin:0 0 8px}
  p{margin:0 0 12px;font-size:1.15rem;color:var(--tinta-pudar)}
  .layar{display:none}
  .layar.aktif{display:block}
  label{display:block;font-size:1.1rem;margin:14px 0 6px}
  input[type=text]{
    width:100%;font:inherit;font-size:1.3rem;padding:8px 10px;color:var(--tinta);
    background:var(--putih);border:2px solid var(--tinta);border-radius:4px;
  }
  .pilihan{display:flex;flex-wrap:wrap;gap:8px}
  .pilihan input{position:absolute;opacity:0;pointer-events:none}
  .pilihan span{
    display:inline-block;min-width:46px;text-align:center;padding:6px 12px;font-size:1.35rem;
    border:2px solid var(--tinta);border-radius:4px;background:var(--putih);cursor:pointer;user-select:none;
  }
  .pilihan input:checked + span{background:var(--stabilo);color:#1E3A5F;box-shadow:2px 2px 0 var(--tinta)}
  .pilihan input:focus-visible + span{outline:3px solid var(--margin);outline-offset:2px}
  button{
    font:inherit;cursor:pointer;color:var(--tinta);background:var(--putih);
    border:2px solid var(--tinta);border-radius:4px;box-shadow:3px 3px 0 var(--tinta);
  }
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
  button:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
  .utama{width:100%;margin-top:22px;padding:10px;font-size:1.5rem;background:var(--stabilo);color:#1E3A5F}

  /* --- Layar bermain --- */
  .info{display:flex;justify-content:space-between;font-size:1.2rem;margin-bottom:8px}
  .waktu{height:12px;border:2px solid var(--tinta);border-radius:3px;background:var(--putih);overflow:hidden}
  .waktu div{height:100%;width:100%;background:var(--benar);transform-origin:left;transition:background .3s}
  .waktu div.kritis{background:var(--salah)}
  .soal{
    font-family:'Gaegu',cursive;font-size:4rem;text-align:center;margin:20px 0 10px;
    white-space:nowrap;letter-spacing:.02em;
  }
  .jawaban{
    min-height:62px;text-align:center;font-size:2.6rem;font-family:'Gaegu',cursive;
    border-bottom:3px solid var(--tinta);margin:0 20px 6px;line-height:1.5;
  }
  .jawaban.benar{color:var(--benar);animation:loncat .35s}
  .jawaban.salah{color:var(--salah);animation:geter .35s}
  .umpan{min-height:28px;text-align:center;font-size:1.2rem;color:var(--tinta-pudar)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .keypad button{padding:12px 0;font-size:1.7rem}
  .keypad .jawab{grid-column:span 2;background:var(--stabilo);color:#1E3A5F}
  @keyframes loncat{50%{transform:scale(1.15)}}
  @keyframes geter{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media (prefers-reduced-motion: reduce){ .jawaban.benar,.jawaban.salah{animation:none} .waktu div{transition:none} }

  /* --- Hasil --- */
  .nilai{font-family:'Gaegu',cursive;font-size:4.5rem;line-height:1;margin:4px 0}
  .ringkas{font-size:1.2rem;margin-bottom:14px}
  ol.papan{margin:6px 0 0;padding-left:26px;font-size:1.2rem}
  ol.papan li{padding:3px 0;border-bottom:1px dashed var(--garis)}
  ol.papan li.saya{background:var(--stabilo);color:#1E3A5F}
  ol.papan .skor{float:right;font-weight:bold}
  .baris{display:flex;gap:10px;margin-top:16px}
  .baris button{flex:1;padding:9px;font-size:1.25rem}
</style>
</head>
<body>
<main class="kertas">

  <!-- Layar awal -->
  <section id="awal" class="layar aktif">
    <h1>Hitung Cepat</h1>
    <p>Jawab 10 soal sebelum waktu habis. Makin cepat, makin besar skornya.</p>

    <label for="nama">Nama pemain</label>
    <input id="nama" type="text" maxlength="20" placeholder="Tulis namamu" autocomplete="off">

    <label>Operasi</label>
    <div class="pilihan" id="pilihOperasi">
      <label><input type="checkbox" value="+" checked><span>+</span></label>
      <label><input type="checkbox" value="-" checked><span>−</span></label>
      <label><input type="checkbox" value="×"><span>×</span></label>
      <label><input type="checkbox" value="÷"><span>÷</span></label>
    </div>

    <label>Tingkat</label>
    <div class="pilihan" id="pilihLevel">
      <label><input type="radio" name="level" value="mudah" checked><span>Mudah</span></label>
      <label><input type="radio" name="level" value="sedang"><span>Sedang</span></label>
      <label><input type="radio" name="level" value="sulit"><span>Sulit</span></label>
    </div>

    <button class="utama" id="btnMulai">Mulai main</button>
    <p id="pesanAwal" style="margin-top:10px;color:var(--salah)"></p>
  </section>

  <!-- Layar bermain -->
  <section id="main" class="layar" aria-live="polite">
    <div class="info">
      <span id="infoSoal">Soal 1/10</span>
      <span id="infoSkor">Skor 0</span>
      <span id="infoRuntun">Runtun 0</span>
    </div>
    <div class="waktu" aria-hidden="true"><div id="barWaktu"></div></div>
    <div class="soal" id="soal">0 + 0</div>
    <div class="jawaban" id="jawaban" aria-label="Jawabanmu"></div>
    <div class="umpan" id="umpan"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="hapus" aria-label="Hapus">⌫</button>
      <button data-k="0">0</button>
      <button data-k="-" aria-label="Minus">−</button>
      <button class="jawab" data-k="enter">Jawab</button>
      <button data-k="lewati">Lewati</button>
    </div>
  </section>

  <!-- Layar hasil -->
  <section id="hasil" class="layar">
    <h2 id="judulHasil">Selesai!</h2>
    <div class="nilai" id="nilaiAkhir">0</div>
    <div class="ringkas" id="ringkas"></div>
    <h2>Papan skor</h2>
    <div id="statusPapan" style="color:var(--tinta-pudar);font-size:1.1rem">Memuat…</div>
    <ol class="papan" id="papan"></ol>
    <div class="baris">
      <button id="btnUlang">Main lagi</button>
      <button id="btnMenu">Ubah pengaturan</button>
    </div>
  </section>

</main>

<script>
(function(){
  var TOTAL = 10;
  var KONFIG = {
    mudah:  {tambah:10, kali:5,  waktu:15},
    sedang: {tambah:50, kali:10, waktu:12},
    sulit:  {tambah:200, kali:15, waktu:10}
  };

  var $ = function(id){return document.getElementById(id)};
  var layar = {awal:$('awal'), main:$('main'), hasil:$('hasil')};
  var state = {};
  var timer = null;

  function tampil(nama){
    for (var k in layar) layar[k].classList.toggle('aktif', k===nama);
  }
  function acak(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

  /* ---------- Pembuat soal ---------- */
  function buatSoal(op, lv){
    var c = KONFIG[lv], a, b, jawab;
    if (op === '+'){ a=acak(1,c.tambah); b=acak(1,c.tambah); jawab=a+b; }
    else if (op === '-'){ a=acak(1,c.tambah); b=acak(1,c.tambah); if(b>a){var t=a;a=b;b=t;} jawab=a-b; }
    else if (op === '×'){ a=acak(2,c.kali); b=acak(2,c.kali); jawab=a*b; }
    else { b=acak(2,c.kali); jawab=acak(2,c.kali); a=b*jawab; }
    return {teks:a+' '+op+' '+b, jawab:jawab};
  }

  /* ---------- Alur permainan ---------- */
  function mulai(){
    var nama = $('nama').value.trim();
    var ops = Array.prototype.map.call(
      document.querySelectorAll('#pilihOperasi input:checked'), function(i){return i.value});
    if (!nama){ $('pesanAwal').textContent='Isi nama pemain dulu.'; $('nama').focus(); return; }
    if (!ops.length){ $('pesanAwal').textContent='Pilih minimal satu operasi.'; return; }
    $('pesanAwal').textContent='';
    var lv = document.querySelector('input[name=level]:checked').value;
    state = {nama:nama, ops:ops, level:lv, no:0, skor:0, benar:0, runtun:0, input:'', kunci:false, soal:null};
    tampil('main');
    soalBerikut();
  }

  function soalBerikut(){
    if (state.no >= TOTAL){ selesai(); return; }
    state.no++;
    var op = state.ops[acak(0, state.ops.length-1)];
    state.soal = buatSoal(op, state.level);
    state.input = ''; state.kunci = false;
    $('soal').textContent = state.soal.teks.replace('-', '−') + ' = ?';
    $('jawaban').className = 'jawaban';
    $('umpan').textContent = '';
    perbarui();
    mulaiWaktu();
  }

  function perbarui(){
    $('infoSoal').textContent = 'Soal ' + state.no + '/' + TOTAL;
    $('infoSkor').textContent = 'Skor ' + state.skor;
    $('infoRuntun').textContent = 'Runtun ' + state.runtun;
    $('jawaban').textContent = state.input.replace('-', '−');
  }

  function mulaiWaktu(){
    clearInterval(timer);
    var total = KONFIG[state.level].waktu * 1000, awal = Date.now(), bar = $('barWaktu');
    bar.classList.remove('kritis'); bar.style.transform = 'scaleX(1)';
    state.sisa = total;
    timer = setInterval(function(){
      state.sisa = Math.max(0, total - (Date.now()-awal));
      var p = state.sisa/total;
      bar.style.transform = 'scaleX(' + p + ')';
      bar.classList.toggle('kritis', p < 0.3);
      if (state.sisa <= 0){ clearInterval(timer); nilai(null, true); }
    }, 50);
  }

  function nilai(masukan, habisWaktu){
    if (state.kunci) return;
    state.kunci = true; clearInterval(timer);
    var benar = !habisWaktu && masukan !== null && parseInt(masukan,10) === state.soal.jawab;
    var el = $('jawaban');
    if (benar){
      state.benar++; state.runtun++;
      var bonusWaktu = Math.ceil(state.sisa/1000);
      var bonusRuntun = Math.min(state.runtun-1, 5) * 2;
      var dapat = 10 + bonusWaktu + bonusRuntun;
      state.skor += dapat;
      el.classList.add('benar');
      $('umpan').textContent = 'Benar! +' + dapat;
    } else {
      state.runtun = 0;
      el.classList.add('salah');
      $('umpan').textContent = (habisWaktu ? 'Waktu habis. ' : 'Belum tepat. ') + 'Jawabannya ' + String(state.soal.jawab).replace('-','−') + '.';
    }
    perbarui();
    setTimeout(soalBerikut, benar ? 700 : 1400);
  }

  /* ---------- Input ---------- */
  function tekan(k){
    if (!layar.main.classList.contains('aktif') || state.kunci) return;
    if (k === 'hapus') state.input = state.input.slice(0,-1);
    else if (k === 'enter'){ if (state.input !== '' && state.input !== '-') nilai(state.input,false); return; }
    else if (k === 'lewati'){ nilai(null,false); return; }
    else if (k === '-'){ if (state.input === '') state.input = '-'; }
    else if (state.input.replace('-','').length < 5) state.input += k;
    perbarui();
  }
  $('keypad').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (b) tekan(b.getAttribute('data-k'));
  });
  document.addEventListener('keydown', function(e){
    if (!layar.main.classList.contains('aktif')) {
      if (e.key==='Enter' && layar.awal.classList.contains('aktif') && document.activeElement.tagName!=='BUTTON') mulai();
      return;
    }
    if (/^[0-9]$/.test(e.key)) tekan(e.key);
    else if (e.key==='Backspace') tekan('hapus');
    else if (e.key==='Enter'){ e.preventDefault(); tekan('enter'); }
    else if (e.key==='-') tekan('-');
  });

  /* ---------- Hasil & papan skor ---------- */
  function selesai(){
    clearInterval(timer);
    tampil('hasil');
    var persen = Math.round(state.benar/TOTAL*100);
    $('judulHasil').textContent = persen>=80 ? 'Hebat, ' + state.nama + '!' : persen>=50 ? 'Lumayan, ' + state.nama + '.' : 'Ayo coba lagi, ' + state.nama + '.';
    $('nilaiAkhir').textContent = state.skor;
    $('ringkas').textContent = state.benar + ' dari ' + TOTAL + ' soal benar · tingkat ' + state.level;
    $('papan').innerHTML = '';
    $('statusPapan').textContent = 'Memuat…';

    var data = {nama:state.nama, skor:state.skor, benar:state.benar, total:TOTAL, level:state.level, operasi:state.ops.join(' ')};
    if (typeof google !== 'undefined' && google.script && google.script.run){
      google.script.run
        .withSuccessHandler(muatPapan)
        .withFailureHandler(function(err){ $('statusPapan').textContent = 'Skor belum tersimpan: ' + (err && err.message ? err.message : err); })
        .simpanSkor(data);
    } else {
      $('statusPapan').textContent = 'Mode lokal: papan skor aktif saat dijalankan lewat Apps Script.';
    }
  }

  function muatPapan(){
    google.script.run
      .withSuccessHandler(function(rows){
        $('statusPapan').textContent = rows.length ? '' : 'Belum ada skor.';
        var ol = $('papan'); ol.innerHTML = '';
        var tandai = false;
        rows.forEach(function(r){
          var li = document.createElement('li');
          var nm = document.createElement('span'); nm.textContent = r.nama + ' (' + r.level + ')';
          var sk = document.createElement('span'); sk.className = 'skor'; sk.textContent = r.skor;
          li.appendChild(nm); li.appendChild(sk);
          if (!tandai && r.nama === state.nama && Number(r.skor) === state.skor){ li.className='saya'; tandai=true; }
          ol.appendChild(li);
        });
      })
      .withFailureHandler(function(err){ $('statusPapan').textContent = 'Gagal memuat papan skor.'; })
      .ambilPapanSkor();
  }

  $('btnMulai').addEventListener('click', mulai);
  $('btnUlang').addEventListener('click', function(){
    state = {nama:state.nama, ops:state.ops, level:state.level, no:0, skor:0, benar:0, runtun:0, input:'', kunci:false, soal:null};
    tampil('main'); soalBerikut();
  });
  $('btnMenu').addEventListener('click', function(){ tampil('awal'); });
})();
</script>
</body>
</html>
